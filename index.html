<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Post Form</title>
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

   
    <div class="container my-5"> 
        <div class="row justify-content-center">
           
            <div class="col-12 col-md-6">
                
                <div class="mb-3">
                    <label for="exampleFormControlInput1" class="form-label ">Name: </label>
                    <input type="text" class="form-control name" id="exampleFormControlInput1" placeholder="Enter Your Name: ">
                    <P class="errorOne"></P>
                </div>
                
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label post">Caption: </label>
                    <textarea placeholder="Enter your Caption" class="form-control caption" id="exampleFormControlTextarea1" rows="3"></textarea>
                   <P class="errorTwo"></P>
                </div>
                
                
                <button type="button" class="btn btn-primary updatebutton w-100 mt-3">update</button>
                <button type="button" class="btn btn-primary postbutton w-100 mt-3">Post</button>
                
                
                <div class="tumplate d-flex gap-3 flex-wrap mt-4"> 
                   
                </div>

            </div>
        </div>
    </div>

    
    <script src="js/scrept.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
